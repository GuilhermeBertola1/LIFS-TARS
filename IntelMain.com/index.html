<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Menu do Servidor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 40px;
        }
        .card {
            background: white;
            margin: 15px 0;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        a {
            text-decoration: none;
            color: white;
            background: #0078ff;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 18px;
        }
        a:hover {
            background: #005fcc;
        }
    </style>
</head>
<body>

    <h1>Interface Principal</h1>
    <p>Escolha uma interface:</p>

    <div class="card">
        <h2>Interface 1</h2>
        <a href="http://192.168.0.101:105/">Acessar</a>
    </div>

    <div class="card">
        <h2>Interface 2</h2>
        <a href="http://192.168.0.101:120/">Acessar</a>
    </div>

    <div class="card">
        <h2>Interface 3</h2>
        <a href="http://192.168.0.101:130/">Acessar</a>
    </div>

</body>
</html>
